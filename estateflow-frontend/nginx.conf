server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static build assets are content-hashed by Vite —
    # cache them aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any route that isn't a real file is
    # served index.html, so /security, /visits, etc. work
    # on hard refresh and direct entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell — deploys would be missed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
