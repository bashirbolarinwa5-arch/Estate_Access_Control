# =============================================================
#  EstateFlow — PRODUCTION compose (prebuilt artifacts only)
#
#  Deploy package (created by build-release.ps1):
#
#    release/
#      backend/          → app.jar + Dockerfile      (compiled JAR)
#      frontend/         → dist/ + nginx.conf + Dockerfile (built bundle)
#      docker-compose.prod.yml
#      .env.example
#
#  No source code (src/, pom.xml, package.json) ever reaches
#  the server. Usage on the server:
#
#    1. cp .env.example .env      (fill in real values)
#    2. docker compose -f docker-compose.prod.yml up -d
# =============================================================

services:

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: estateflow-db
    environment:
      POSTGRES_DB: estateflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - estateflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estateflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host — the backend talks to the
    # database over the internal network only.
    restart: unless-stopped

  # ---------- Spring Boot API (prebuilt JAR) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estateflow-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/estateflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- React app (nginx, prebuilt dist) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estateflow-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  estateflow-db:
