# =============================================================
#  EstateFlow — PRODUCTION compose (backend + database only)
#
#  Topology: the React frontend is hosted on Vercel; this file
#  deploys ONLY the API and its database to the VPS.
#
#  Deploy package (created by build-release.ps1):
#
#    release/
#      backend/            → app.jar + Dockerfile (compiled JAR)
#      docker-compose.prod.yml
#      Caddyfile.example   → HTTPS template (enable with a domain)
#      .env.example
#
#  Usage on the server:
#
#    1. cp .env.example .env        (fill in real values)
#    2. docker compose -f docker-compose.prod.yml up -d
# =============================================================

services:

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: estateflow-db
    environment:
      POSTGRES_DB: estateflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - estateflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estateflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host — the backend talks to the
    # database over the internal network only.
    restart: unless-stopped

  # ---------- Spring Boot API (prebuilt JAR) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estateflow-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/estateflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # The ORIGIN of the Vercel-hosted frontend (patterns OK,
      # e.g. https://your-app.vercel.app — comma-separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================
  #  OPTIONAL — HTTPS reverse proxy (enable when you have a domain)
  #
  #  Browsers BLOCK HTTP API calls made from the HTTPS Vercel site
  #  ("mixed content"), so production needs the API served over
  #  HTTPS. Caddy obtains and renews certificates automatically.
  #
  #  1. Point api.your-domain.com (A record) at the VPS IP
  #  2. cp Caddyfile.example Caddyfile   (edit the domain)
  #  3. Uncomment the service below and the volume at the bottom
  #  4. docker compose -f docker-compose.prod.yml up -d
  #
  #  Then the frontend's VITE_API_BASE_URL becomes
  #  https://api.your-domain.com and port 8081 can be closed in
  #  the firewall (ufw delete allow 8081/tcp).
  # =============================================================
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: estateflow-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  estateflow-db:
  # caddy-data:
  # caddy-config:
