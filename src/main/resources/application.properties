spring.application.name=Estate_Access_ControlFlow

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/estateflow
spring.datasource.username=postgres

# Hibernate Properties to Automatically Build/Update Tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Baseline the populated production schema at 0, then apply V1 before Hibernate initializes.
# This preserves all existing numeric primary keys and relationships.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

spring.datasource.password=${DB_PASSWORD}
server.port = 8081

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Comma-separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------
# Email (password reset links)
#
# The reset token is delivered ONLY by email. Nothing is
# ever returned to the browser.
#
# Defaults target Gmail SMTP with STARTTLS (port 587).
# All values come from env — no credentials live in code.
# ---------------------------------------------------------

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:no-reply@estateflow.local}
app.mail.from-name=${MAIL_FROM_NAME:EstateFlow}
